services:
  portfolio-agent:
    build: .
    restart: unless-stopped
    environment:
      # Swap the model without rebuilding. Zen free models are beta and
      # can disappear without notice.
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode/big-pickle}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
    # No credentials: Zen free models answer anonymously, so the container
    # holds no secret to leak.
    # No published ports: reachable only from n8n over the shared network.
    networks:
      - portfolio-agent-net
      - dokploy-network
    mem_limit: 1g
    cpus: 0.5
    read_only: true
    # read_only rootfs, so opencode's writable paths come from named volumes.
    # Docker seeds a fresh named volume from the image, carrying the uid 10001
    # ownership set in the Dockerfile — which a bare tmpfs does not do.
    volumes:
      - agent-state:/workspace/.local
      - agent-config:/workspace/.config
      - agent-cache:/workspace/.cache
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The server enforces basic auth, so an unauthenticated probe would
    # always 401 and mark the container unhealthy.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header="Authorization: Basic $$(printf '%s:%s'
          "$$OPENCODE_SERVER_USERNAME" "$$OPENCODE_SERVER_PASSWORD" | base64 -w0)"
          http://127.0.0.1:4096/global/health >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agent-state:
  agent-config:
  agent-cache:

networks:
  portfolio-agent-net:
    driver: bridge
  dokploy-network:
    external: true
