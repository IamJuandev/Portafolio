# Gateway between n8n (dokploy-network) and the isolated agent.
# Only the OpenCode API paths the n8n workflow uses are forwarded.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16k;

    # Docker's embedded DNS. A variable upstream is resolved per request,
    # so nginx starts even while the agent is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 4096;
        default_type application/json;

        set $agent_upstream http://agent:4096;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Authorization is forwarded unchanged; the agent enforces basic auth.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # The experimental wait endpoint can block for ~120 s.
        proxy_read_timeout 150s;

        # Container healthcheck only; not reachable from other hosts.
        location = /healthz {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 204;
        }

        location = /global/health {
            limit_except GET { deny all; }
            proxy_pass $agent_upstream;
        }

        # POST creates a chat session; GET lists sessions for the n8n janitor.
        location = /api/session {
            limit_except GET POST { deny all; }
            proxy_pass $agent_upstream;
        }

        # The n8n janitor deletes sessions idle past the Redis TTL.
        location ~ ^/api/session/ses_[A-Za-z0-9]+$ {
            limit_except DELETE { deny all; }
            proxy_pass $agent_upstream;
        }

        location ~ ^/api/session/ses_[A-Za-z0-9]+/prompt$ {
            limit_except POST { deny all; }
            proxy_pass $agent_upstream;
        }

        location ~ ^/api/session/ses_[A-Za-z0-9]+/message$ {
            limit_except GET { deny all; }
            proxy_pass $agent_upstream;
        }

        location ~ ^/api/experimental/session/ses_[A-Za-z0-9]+/wait$ {
            limit_except POST { deny all; }
            proxy_pass $agent_upstream;
        }

        location / {
            return 404;
        }
    }
}
