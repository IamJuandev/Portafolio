<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      @page { size: A4; margin: 13mm 14mm; }
      :root { color: #101820; font-family: Arial, Helvetica, sans-serif; font-size: 9.25pt; line-height: 1.35; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .cv { max-width: 182mm; margin: 0 auto; }
      header { border-bottom: 2px solid #2340c8; padding-bottom: 9px; }
      h1 { color: #1a2f96; font-size: 21pt; letter-spacing: .01em; line-height: 1.05; margin: 0 0 4px; }
      .headline { color: #2340c8; font-size: 11pt; font-weight: 700; margin: 0 0 5px; }
      .contact, .availability { margin: 2px 0; }
      .availability { font-weight: 700; }
      section { break-inside: avoid; margin-top: 12px; }
      h2 { border-bottom: 1px solid #2340c8; color: #1a2f96; font-size: 10.5pt; letter-spacing: .08em; margin: 0 0 6px; padding-bottom: 3px; text-transform: uppercase; }
      h3 { font-size: 10pt; margin: 0; }
      p { margin: 0 0 6px; }
      .entry { break-inside: avoid; margin-bottom: 8px; }
      .entry-head { display: flex; gap: 10px; justify-content: space-between; }
      .period { flex: none; font-weight: 700; text-align: right; }
      ul { margin: 3px 0 0; padding-left: 17px; }
      li { margin: 0 0 2px; }
      .skills { margin: 0; }
      .skills div { margin: 0 0 3px; }
      .skills dt { display: inline; font-weight: 700; }
      .skills dd { display: inline; margin: 0; }
      .skills dd::before { content: ": "; }
      .project { margin-bottom: 5px; }
      .education-detail { margin: 2px 0 0; }
      a { color: inherit; text-decoration: none; }
      @media screen { body { background: #e4e9f8; padding: 22px; } .cv { background: white; box-shadow: 0 2px 12px #1a2f9640; padding: 13mm 14mm; } }
    </style>
  </head>
  <body>
    {{content}}
  </body>
</html>
