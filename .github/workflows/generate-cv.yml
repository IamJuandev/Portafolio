name: Generate CV

on:
  push:
    branches: [master]
    paths:
      - 'agent/portfolio-facts.json'
      - 'agent/templates/cv.html'
      - 'agent/scripts/generate-cv.mjs'
      - 'agent/scripts/validate-cv.mjs'
      - 'agent/scripts/cv.test.mjs'
      - 'agent/scripts/cv-workflow.test.mjs'
      - 'agent/scripts/generate-agents.mjs'
      - 'agent/scripts/validate-agents.mjs'
      - '.github/workflows/generate-cv.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-cv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PDF text validator
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Locate hosted PDF tooling
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          pdftotext -v
      - name: Test and generate current outputs
        run: |
          node --test agent/scripts/cv.test.mjs agent/scripts/cv-workflow.test.mjs
          node agent/scripts/generate-agents.mjs
          node agent/scripts/validate-agents.mjs
          node agent/scripts/generate-cv.mjs
          node agent/scripts/validate-cv.mjs
      - name: Commit generated files when changed
        id: generated
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "::error::master advanced before generation; refusing to publish stale output."
            exit 1
          fi
          git add -- agent/AGENTS.md assets/cv/CV-Juan-Gabriel-Alfonso-Rojas.html assets/cv/CV-Juan-Gabriel-Alfonso-Rojas.pdf
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cv): regenerate generated outputs"
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::master advanced before publishing; refusing non-fast-forward update."
            exit 1
          fi
          git push origin HEAD:master
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Build legacy GitHub Pages after bot commit
        if: steps.generated.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --show-error --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
